<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترحيب - بوت نجم | BOT Najm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* تنسيق الصفحة الأولى لتكون صورتك الفخمة بالكامل */
        #page1.active {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .welcome-image-box {
            position: relative;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .welcome-image-box img {
            width: 100%;
            border-radius: 15px;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        /* زر مخفي شفاف تماماً يطابق مكان زر "أكمل" المرسوم في أسفل صورتك[span_1](start_span)[span_1](end_span) */
        .image-clickable-btn {
            position: absolute;
            bottom: 6%;
            left: 15%;
            width: 70%;
            height: 12%;
            background: transparent;
            cursor: pointer;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الصفحة الأولى (صورتك الفخمة) -->
        <div id="page1" class="page active">
            <div class="welcome-image-box">
                <!-- تأكد أن صورتك مرفوعة في مجلد static باسم welcome-bg.jpg[span_2](start_span)[span_2](end_span) -->
                <img src="{{ url_for('static', filename='welcome-bg.jpg') }}" alt="ترحيب بوت نجم">
                
                <!-- زر تفاعلي شفاف فوق زر "أكمل" المرسوم في الصورة لينقلك للصفحة الثانية[span_3](start_span)[span_3](end_span) -->
                <button class="image-clickable-btn" onclick="goToPage2()"></button>
            </div>
        </div>

        <!-- الصفحة الثانية -->
        <div id="page2" class="page">
            <div class="fancy-box">
                <h2 style="margin-bottom: 20px; font-size: 22px;">ماذا نريد منكـ/ـي؟</h2>
                <p class="welcome-text" style="font-size: 17px;">
                    ما نبي منك سوى دعمنا ونشر بوت نجم لأي شخص تعرفه عشان يوصل لأكبر عدد ويستفيد الكل، وبيض الله وجهك مقدماً!
                </p>
            </div>

            <button class="royal-btn" onclick="registerUser()">تسجيل</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
