<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترحيب - بوت نجم | BOT Najm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #0b0713;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page {
            display: none;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        .welcome-image-box {
            position: relative;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .welcome-image-box img {
            width: 100%;
            border-radius: 15px;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .image-clickable-btn {
            position: absolute;
            bottom: 6%;
            left: 15%;
            width: 70%;
            height: 12%;
            background: transparent;
            cursor: pointer;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الصفحة الأولى (صورتك الفخمة) -->
        <div id="page1" class="page active">
            <div class="welcome-image-box">
                <!-- تم استخدام اسم ملفك الحقيقي الموجود في مجلد static -->
                <img src="/static/1791165368288.jpg" alt="ترحيب بوت نجم">
                <button class="image-clickable-btn" onclick="goToPage2()"></button>
            </div>
        </div>

        <!-- الصفحة الثانية -->
        <div id="page2" class="page" style="flex-direction: column;">
            <div class="fancy-box" style="max-width: 400px; width: 90%;">
                <h2 style="margin-bottom: 20px; font-size: 22px;">ماذا نريد منكـ/ـي؟</h2>
                <p class="welcome-text" style="font-size: 17px;">
                    ما نبي منك سوى دعمنا ونشر بوت نجم لأي شخص تعرفه عشان يوصل لأكبر عدد ويستفيد الكل، وبيض الله وجهك مقدماً!
                </p>
            </div>

            <button class="royal-btn" onclick="registerUser()">تسجيل</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
