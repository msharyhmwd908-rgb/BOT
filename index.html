<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترحيب - بوت نجم | BOT Najm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0713;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        .welcome-image-box {
            position: relative;
            width: 100vw;
            height: 100vh;
            text-align: center;
        }
        .welcome-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* ضبط مكان الزر الشفاف تماماً فوق زر "أكمل" */
        .image-clickable-btn {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            max-width: 280px;
            height: 8%;
            background: transparent;
            cursor: pointer;
            border: none;
            outline: none;
        }
        /* ضبط مكان الزر الشفاف تماماً فوق زر "تسجيل" في الصفحة الثانية */
        .register-clickable-btn {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            max-width: 280px;
            height: 8%;
            background: transparent;
            cursor: pointer;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الصفحة الأولى (صورة الترحيب وزر أكمل) -->
        <div id="page1" class="page active">
            <div class="welcome-image-box">
                <img src="/static/1791165368288.jpg" alt="ترحيب بوت نجم">
                <button class="image-clickable-btn" onclick="goToPage2()"></button>
            </div>
        </div>

        <!-- الصفحة الثانية (صورة ماذا نريد منك وزر تسجيل) -->
        <div id="page2" class="page">
            <div class="welcome-image-box">
                <img src="/static/1791165964950.jpg" alt="ماذا نريد منك بوت نجم">
                <button class="register-clickable-btn" onclick="registerUser()"></button>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
