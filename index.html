<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترحيب - بوت نجم | BOT Najm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0713;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        /* جعل الصورة تغطي الشاشة بالكامل */
        .welcome-image-box {
            position: relative;
            width: 100vw;
            height: 100vh;
            text-align: center;
        }
        .welcome-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* لضمان تغطية الشاشة بالكامل بدون تشويه */
            display: block;
        }
        /* تعديل مكان الزر الشفاف ليطابق زر "أكمل" بحجم الشاشة الكامل */
        .image-clickable-btn {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 60px;
            background: transparent;
            cursor: pointer;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الصفحة الأولى (صورتك الفخمة بكامل الشاشة) -->
        <div id="page1" class="page active">
            <div class="welcome-image-box">
                <img src="/static/1791165368288.jpg" alt="ترحيب بوت نجم">
                <button class="image-clickable-btn" onclick="goToPage2()"></button>
            </div>
        </div>

        <!-- الصفحة الثانية -->
        <div id="page2" class="page" style="flex-direction: column; background-color: #0b0713;">
            <div class="fancy-box" style="max-width: 400px; width: 90%;">
                <h2 style="margin-bottom: 20px; font-size: 22px;">ماذا نريد منكـ/ـي؟</h2>
                <p class="welcome-text" style="font-size: 17px;">
                    ما نبي منك سوى دعمنا ونشر بوت نجم لأي شخص تعرفه عشان يوصل لأكبر عدد ويستفيد الكل، وبيض الله وجهك مقدماً!
                </p>
            </div>

            <button class="royal-btn" onclick="registerUser()">تسجيل</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
