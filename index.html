<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم البوت - Aven</title>
    <style>
        :root {
            --bg-deep: #050b14;
            --bg-card: #0a192f;
            --accent-cyan: #00f0ff;
            --accent-blue: #1e3a8a;
            --accent-light: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* نظام الصفحات */
        .page {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .page.active {
            display: block;
        }

        /* الصفحة الأولى: البداية والمصمم */
        .designer-badge {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--accent-light);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: var(--accent-light);
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            letter-spacing: 1px;
        }

        .bot-logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent-cyan);
            object-fit: cover;
            margin: 0 auto 25px auto;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            display: block;
        }

        .start-container {
            position: relative;
            margin-top: 20px;
            display: inline-block;
        }

        .crown {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .btn-start {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 2px solid var(--accent-cyan);
            padding: 14px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transition: 0.3s;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            transform: scale(1.05);
        }

        /* الصفحة الثانية: الداشبورد والإعدادات */
        .page-title {
            font-size: 2rem;
            color: #ffffff;
            text-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-light);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .limit-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-blue);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--accent-light);
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(30, 58, 138, 0.5);
        }

        .btn-invite {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
        }

        .btn-invite:hover {
            background: #0369a1;
        }

        /* حدود الصفحة والمربع الحاضن */
        .dashboard-frame {
            border: 2px solid var(--accent-cyan);
            border-radius: 20px;
            padding: 25px;
            background: rgba(3, 7, 18, 0.6);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
        }

        /* مربع معلومات السيرفر */
        .server-card {
            background: rgba(10, 25, 47, 0.9);
            border: 1px solid #1e3a8a;
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            text-align: right;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .server-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .server-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent-light);
            object-fit: cover;
        }

        .server-info h3 {
            margin: 0 0 5px 0;
            color: #ffffff;
            font-size: 1.1rem;
        }

        .server-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .btn-server-settings {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a, #172554);
            color: white;
            border: 1px solid var(--accent-light);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-server-settings:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
        }
    </style>
</head>
<body>

    <!-- الصفحة الأولى -->
    <div id="page1" class="page active">
        <div class="designer-badge">
            ✨ المصمم: شاب سعودي ~ حمود البقمي ✨
        </div>
        
        <!-- صورة البوت التي أرفقتها -->
        <img src="1000003557.png" alt="Bot Image" class="bot-logo">
        
        <div class="start-container">
            <div class="crown">👑</div>
            <button class="btn-start" onclick="goToDashboard()">بدء</button>
        </div>
    </div>

    <!-- الصفحة الثانية (الداشبورد) -->
    <div id="page2" class="page">
        <div class="dashboard-frame">
            <!-- النص العلوي للإعدادات مع الشعاع الأزرق -->
            <div class="page-title">الإعدادات</div>

            <!-- مربع الحد المسموح -->
            <div class="limit-box">
                الحد المسموح لتجيل البوت 5 سيرفرات
            </div>

            <!-- زر دعوة البوت -->
            <button class="btn-invite" onclick="simulateInvite()">دعوة البوت</button>

            <!-- مربع معلومات السيرفر (يظهر بعد دعوة البوت أو تجريبي) -->
            <div id="serverCardSection" style="display: none;">
                <div class="server-card">
                    <div class="server-header">
                        <img src="1000003557.png" alt="Server Icon" class="server-icon">
                        <div class="server-info">
                            <h3>سيرفر حمود الرسمي</h3>
                            <p>👥 عدد الأعضاء: 1,250 عضواً</p>
                            <p>🟢 الحالة: متصل وجاهز</p>
                        </div>
                    </div>
                    <button class="btn-server-settings" onclick="alert('تم الانتقال إلى إعدادات السيرفر الخاصة ببوتك!')">إعدادات البوت للسيرفر</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // دالة الانتقال للصفحة الثانية
        function goToDashboard() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
        }

        // محاكاة دعوة البوت وإظهار كارد السيرفر
        function simulateInvite() {
            alert('تم إرسال طلب دعوة البوت لسيرفرك بنجاح!');
            document.getElementById('serverCardSection').style.display = 'block';
        }
    </script>

</body>
</html>
